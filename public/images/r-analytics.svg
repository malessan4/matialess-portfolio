<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="4,4">
    <line x1="80" y1="80" x2="720" y2="80" />
    <line x1="80" y1="140" x2="720" y2="140" />
    <line x1="80" y1="200" x2="720" y2="200" />
    <line x1="80" y1="260" x2="720" y2="260" />
    <line x1="80" y1="320" x2="720" y2="320" />
    <line x1="160" y1="60" x2="160" y2="340" />
    <line x1="280" y1="60" x2="280" y2="340" />
    <line x1="400" y1="60" x2="400" y2="340" />
    <line x1="520" y1="60" x2="520" y2="340" />
    <line x1="640" y1="60" x2="640" y2="340" />
  </g>

  <!-- Histogram / Bars -->
  <rect x="110" y="240" width="35" height="80" rx="4" fill="url(#barGrad1)" />
  <rect x="155" y="190" width="35" height="130" rx="4" fill="url(#barGrad1)" />
  <rect x="200" y="150" width="35" height="170" rx="4" fill="url(#barGrad1)" />
  <rect x="245" y="110" width="35" height="210" rx="4" fill="url(#barGrad2)" />
  <rect x="290" y="140" width="35" height="180" rx="4" fill="url(#barGrad2)" />
  <rect x="335" y="180" width="35" height="140" rx="4" fill="url(#barGrad3)" />
  <rect x="380" y="220" width="35" height="100" rx="4" fill="url(#barGrad3)" />
  <rect x="425" y="270" width="35" height="50" rx="4" fill="url(#barGrad3)" />

  <!-- Regression line & Confidence Band -->
  <path d="M 460 280 Q 550 200, 710 110" fill="none" stroke="url(#curveGrad)" stroke-width="4" filter="url(#glow)" />
  
  <!-- Scatter plot points (ggplot geom_point) -->
  <g fill="#38bdf8" opacity="0.85">
    <circle cx="480" cy="275" r="5" />
    <circle cx="510" cy="245" r="6" />
    <circle cx="530" cy="255" r="4" />
    <circle cx="545" cy="220" r="7" fill="#818cf8" />
    <circle cx="560" cy="205" r="5" fill="#818cf8" />
    <circle cx="580" cy="190" r="6" fill="#a855f7" />
    <circle cx="600" cy="198" r="5" fill="#a855f7" />
    <circle cx="620" cy="165" r="7" fill="#34d399" />
    <circle cx="650" cy="150" r="5" fill="#34d399" />
    <circle cx="670" cy="130" r="6" fill="#34d399" />
    <circle cx="690" cy="120" r="5" fill="#34d399" />
    <!-- Outliers -->
    <circle cx="530" cy="140" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="2" />
    <circle cx="660" cy="250" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Outlier Annotations -->
  <text x="545" y="135" fill="#fda4af" font-family="sans-serif" font-size="11" font-weight="bold">Outlier Detected</text>

  <!-- Axes Baseline -->
  <line x1="80" y1="320" x2="720" y2="320" stroke="#94a3b8" stroke-width="2" />
  <line x1="80" y1="60" x2="80" y2="320" stroke="#94a3b8" stroke-width="2" />

  <!-- Header Card / Badges -->
  <rect x="80" y="25" width="130" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="95" y="46" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="900">R + ggplot2</text>

  <rect x="220" y="25" width="170" height="32" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
  <text x="235" y="46" fill="#e9d5ff" font-family="sans-serif" font-size="13" font-weight="bold">Exploratory Data (EDA)</text>

  <rect x="400" y="25" width="180" height="32" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
  <text x="415" y="46" fill="#a7f3d0" font-family="sans-serif" font-size="13" font-weight="bold">Statistical Modeling</text>

  <!-- Bottom Info Panel -->
  <rect x="80" y="355" width="640" height="70" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
  <text x="105" y="385" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">Data Analytics &amp; Statistical Visualization</text>
  <text x="105" y="408" fill="#94a3b8" font-family="sans-serif" font-size="13">Correlation, Distributions, Trend Analysis &amp; Data Cleaning in R</text>
  <rect x="620" y="372" width="80" height="32" rx="6" fill="#0369a1" />
  <text x="640" y="393" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">R Script</text>
</svg>
